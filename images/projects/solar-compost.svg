<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1329" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <linearGradient id="accentP1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>
    <linearGradient id="solarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>
  </defs>

  <rect width="600" height="350" fill="url(#bgP1)" />

  <!-- Subtle Circuit Grid -->
  <g stroke="#334155" stroke-width="1" opacity="0.35">
    <line x1="50" y1="0" x2="50" y2="350" />
    <line x1="150" y1="0" x2="150" y2="350" />
    <line x1="250" y1="0" x2="250" y2="350" />
    <line x1="350" y1="0" x2="350" y2="350" />
    <line x1="450" y1="0" x2="450" y2="350" />
    <line x1="550" y1="0" x2="550" y2="350" />
    <line x1="0" y1="70" x2="600" y2="70" />
    <line x1="0" y1="175" x2="600" y2="175" />
    <line x1="0" y1="280" x2="600" y2="280" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="35" width="130" height="28" rx="14" fill="#064E3B" stroke="#10B981" stroke-width="1.5" />
  <text x="105" y="54" text-anchor="middle" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="12" font-weight="600">ESP32 &amp; IoT</text>

  <!-- Solar Panel Icon/Representation -->
  <g transform="translate(70, 110)">
    <!-- Solar Frame -->
    <rect x="0" y="0" width="140" height="90" rx="8" fill="#1E293B" stroke="url(#solarGrad)" stroke-width="2.5" />
    <!-- Cells -->
    <line x1="46" y1="0" x2="46" y2="90" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
    <line x1="93" y1="0" x2="93" y2="90" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
    <line x1="0" y1="45" x2="140" y2="45" stroke="#F59E0B" stroke-width="1.5" opacity="0.6" />
    <!-- Sun Rays badge -->
    <circle cx="140" cy="0" r="14" fill="#F59E0B" opacity="0.85" />
    <text x="70" y="115" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">12V Solar Supply</text>
  </g>

  <!-- Connection Line -->
  <path d="M 215 155 L 275 155" stroke="#38BDF8" stroke-width="2.5" stroke-dasharray="6 4" />
  <circle cx="275" cy="155" r="4" fill="#38BDF8" />

  <!-- ESP32 Core Box -->
  <g transform="translate(265, 95)">
    <rect x="0" y="0" width="150" height="120" rx="12" fill="#0F172A" stroke="#38BDF8" stroke-width="2.5" />
    <rect x="15" y="15" width="120" height="35" rx="6" fill="#1E293B" />
    <text x="75" y="38" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="14" font-weight="700">ESP32 MCU</text>
    <text x="75" y="75" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">DHT22 Temp / Humidity</text>
    <text x="75" y="93" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="11">MQ-135 Gas Monitor</text>
    <text x="75" y="145" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Automation Core</text>
  </g>

  <!-- Output / Actuators Line -->
  <path d="M 420 155 L 470 155" stroke="#10B981" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Actuators / Web Box -->
  <g transform="translate(460, 95)">
    <rect x="0" y="0" width="105" height="120" rx="12" fill="#1E293B" stroke="#10B981" stroke-width="2" />
    <circle cx="52" cy="35" r="16" fill="#065F46" />
    <text x="52" y="40" text-anchor="middle" fill="#34D399" font-family="'Inter', sans-serif" font-size="14">⚙</text>
    <text x="52" y="70" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">L298N Motor</text>
    <text x="52" y="85" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10" font-weight="600">Fan Relays</text>
    <text x="52" y="103" text-anchor="middle" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="9">Telegram/Web</text>
  </g>

  <!-- Project Title Banner Bottom -->
  <rect x="40" y="275" width="520" height="45" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="303" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">IoT-Based Solar Compost System</text>
  <text x="535" y="303" text-anchor="end" fill="#38BDF8" font-family="'Inter', sans-serif" font-size="13" font-weight="600">2026</text>
</svg>

