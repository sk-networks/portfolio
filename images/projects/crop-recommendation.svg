<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350">
  <defs>
    <linearGradient id="bgP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#14532D" />
    </linearGradient>
    <linearGradient id="accentP3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
  </defs>

  <rect width="600" height="350" fill="url(#bgP3)" />

  <!-- Background Grid -->
  <g stroke="#166534" stroke-width="1" opacity="0.35">
    <circle cx="300" cy="160" r="60" fill="none" />
    <circle cx="300" cy="160" r="120" fill="none" />
    <circle cx="300" cy="160" r="180" fill="none" />
  </g>

  <!-- Tag Pill -->
  <rect x="40" y="35" width="160" height="28" rx="14" fill="#064E3B" stroke="#22C55E" stroke-width="1.5" />
  <text x="120" y="54" text-anchor="middle" fill="#86EFAC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Machine Learning &amp; AI</text>

  <!-- Left Inputs Card -->
  <g transform="translate(60, 95)">
    <rect x="0" y="0" width="130" height="125" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2" />
    <text x="65" y="28" text-anchor="middle" fill="#86EFAC" font-family="'Inter', sans-serif" font-size="12" font-weight="700">SOIL &amp; CLIMATE</text>
    <line x1="15" y1="38" x2="115" y2="38" stroke="#334155" />
    <text x="65" y="58" text-anchor="middle" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">N, P, K Levels</text>
    <text x="65" y="78" text-anchor="middle" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">Temp &amp; Humidity</text>
    <text x="65" y="98" text-anchor="middle" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="11">pH &amp; Rainfall</text>
    <text x="65" y="145" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Feature Inputs</text>
  </g>

  <!-- Line to ML Engine -->
  <path d="M 195 155 L 235 155" stroke="#22C55E" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Center ML Random Forest Model -->
  <g transform="translate(230, 85)">
    <rect x="0" y="0" width="140" height="145" rx="14" fill="#0F172A" stroke="#84CC16" stroke-width="2.5" />
    <text x="70" y="32" text-anchor="middle" fill="#BEF264" font-family="'Inter', sans-serif" font-size="12" font-weight="700">RANDOM FOREST</text>
    <line x1="20" y1="44" x2="120" y2="44" stroke="#334155" />
    <!-- Decision Tree Nodes Graphic -->
    <circle cx="70" cy="65" r="7" fill="#84CC16" />
    <line x1="70" y1="72" x2="45" y2="92" stroke="#84CC16" stroke-width="1.5" />
    <line x1="70" y1="72" x2="95" y2="92" stroke="#84CC16" stroke-width="1.5" />
    <circle cx="45" cy="95" r="6" fill="#22C55E" />
    <circle cx="95" cy="95" r="6" fill="#22C55E" />
    <text x="70" y="125" text-anchor="middle" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="11" font-weight="600">Scikit-learn Model</text>
    <text x="70" y="165" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Classifier</text>
  </g>

  <!-- Line to Output -->
  <path d="M 375 155 L 420 155" stroke="#84CC16" stroke-width="2.5" stroke-dasharray="6 4" />

  <!-- Right Flask Dashboard Card -->
  <g transform="translate(415, 95)">
    <rect x="0" y="0" width="130" height="125" rx="12" fill="#1E293B" stroke="#22C55E" stroke-width="2" />
    <circle cx="65" cy="35" r="16" fill="#14532D" />
    <text x="65" y="41" text-anchor="middle" fill="#86EFAC" font-family="'Inter', sans-serif" font-size="13">🌱</text>
    <text x="65" y="70" text-anchor="middle" fill="#86EFAC" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Flask Web App</text>
    <text x="65" y="88" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Real-time Yield</text>
    <text x="65" y="104" text-anchor="middle" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="10">Recommendation</text>
    <text x="65" y="145" text-anchor="middle" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12" font-weight="500">Optimal Crop</text>
  </g>

  <!-- Bottom Bar -->
  <rect x="40" y="275" width="520" height="45" rx="10" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
  <text x="60" y="303" fill="#F8FAFC" font-family="'Inter', sans-serif" font-size="15" font-weight="600">Crop Recommendation System</text>
  <text x="535" y="303" text-anchor="end" fill="#84CC16" font-family="'Inter', sans-serif" font-size="13" font-weight="600">2025</text>
</svg>

